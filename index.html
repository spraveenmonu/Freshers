<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fresher's Day 2026 - Grace College of Engineering</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <!-- ==========================================================================
       MAIN STAGE VIEWPORT (FULL-SCREEN PROJECTOR SLIDE DECK)
       ========================================================================== -->
  <main class="main-stage-viewport" id="viewport">
    <div class="stage-card-wrapper" id="stageContent">
      <!-- Active slide dynamically injected by app.js -->
    </div>
  </main>

  <!-- Presenter Stage Floating HUD -->
  <aside class="floating-stage-hud" id="stageHud" aria-label="Presenter Controls">
    <button class="hud-nav-btn" onclick="prevSlide()" title="Previous Slide (Left Arrow / Backspace)" aria-label="Previous Slide">◀</button>
    <div class="hud-counter-pill" id="slideNum" onclick="goToSlide(1)" title="Click to view Agenda Overview">01 / 30</div>
    <button class="hud-nav-btn" onclick="nextSlide()" title="Next Slide (Right Arrow / Space)" aria-label="Next Slide">▶</button>
    <button class="hud-fs-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen (F)" aria-label="Fullscreen">⛶</button>
  </aside>

  <script src="js/app.js"></script>
</body>

</html>
