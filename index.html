<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fresher's Day</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <!-- ==========================================================================
       MAIN STAGE VIEWPORT (FULL-SCREEN PROJECTOR SLIDE DECK)
       ========================================================================== -->
  <main class="main-stage-viewport" id="viewport">
    <div class="stage-card-wrapper" id="stageContent">
      <!-- Active slide dynamically injected by app.js -->
    </div>
  </main>

  <!-- ==========================================================================
       DISCREET FLOATING PRESENTER HUD (BOTTOM CORNER)
       ========================================================================== -->
  <aside class="floating-stage-hud">
    <button class="hud-nav-btn" onclick="prevSlide()" title="Previous Slide (← / Backspace)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>

    <div class="hud-counter-pill" id="slideNum" onclick="goToSlide(0)" title="Click to jump to Agenda">01 / 29</div>

    <button class="hud-nav-btn" onclick="nextSlide()" title="Next Slide (→ / Space)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>

    <button class="hud-fs-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen (F)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="15 3 21 3 21 9"></polyline>
        <polyline points="9 21 3 21 3 15"></polyline>
        <line x1="21" y1="3" x2="14" y2="10"></line>
        <line x1="3" y1="21" x2="10" y2="14"></line>
      </svg>
    </button>
  </aside>

  <script src="js/app.js"></script>
</body>

</html>
